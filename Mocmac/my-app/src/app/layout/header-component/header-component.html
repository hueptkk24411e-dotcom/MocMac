<div class="top">
  <div class="wrap">
    <div>
      <a routerLink="/gioi-thieu">Giới thiệu</a>
      <a routerLink="/qua-tang-theo-nhu-cau">Quà tặng theo nhu cầu</a>
      <a routerLink="/qua-tang-doanh-nghiep">Quà tặng doanh nghiệp</a>

    <div>
      <a routerLink="/thong-bao">Thông báo</a>

<div class="brand">
  <div class="wrap">
    <a class="logo" routerLink="/">Mộc Mạc<small>Đặc sản & sản phẩm truyền thống Việt</small></a>
    <form class="search" (submit)="$event.preventDefault()">
      <input type="search" placeholder="Tìm đặc sản, làng nghề, vùng miền..." />
      <button type="submit" aria-label="Tìm">&#128269;</button>
    </form>
    <a class="cart" routerLink="/giohang">&#128722; Giỏ hàng <b>0</b></a>
  </div>
</div>

<div class="nav">
  <div class="wrap">
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Trang chủ</a>
      <a routerLink="/san-pham" routerLinkActive="active">Sản phẩm</a>
      <a routerLink="/qua-tang" routerLinkActive="active">Quà tặng</a>
      <a routerLink="/vung-mien" routerLinkActive="active">Vùng miền</a>
      <a routerLink="/lang-nghe" routerLinkActive="active">Làng nghề</a>

  </div>
</div>
